<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Imagens</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .image-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }
        .image-card img {
            max-width: 100%;
            height: auto;
        }
        .image-info {
            margin-top: 10px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Gerenciador de Imagens</h1>
    <div class="image-grid">
        {% for image in images %}
        <div class="image-card">
            <img src="{{ url_for('static', filename=image.image_path) }}" alt="Imagem do CPF {{ image.cpf }}">
            <div class="image-info">
                <p><strong>CPF:</strong> {{ image.cpf }}</p>
                <p><strong>Caminho:</strong> {{ image.image_path }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
