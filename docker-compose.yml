services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:14
    container_name: gestao-img-db
    environment:
      POSTGRES_DB: gestao_img
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gestao-img-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_img"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build: .
    container_name: gestao-img-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestao_img
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    networks:
      - gestao-img-network
    restart: unless-stopped

  # Frontend Nginx (opcional - para servir as páginas de visualização)
  frontend:
    image: nginx:alpine
    container_name: gestao-img-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./static:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - gestao-img-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  gestao-img-network:
    driver: bridge 