services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: gestao_img
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - app-network

  app1-cadastro:
    build: ./app1-cadastro
    ports:
      - "5001:5001"
    volumes:
      - ./app1-cadastro:/app
    environment:
      - POSTGRES_DB=gestao_img
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres
    networks:
      - app-network

  app2-webhook:
    build: ./app2-webhook
    ports:
      - "5002:5002"
    volumes:
      - ./app2-webhook:/app
    environment:
      - POSTGRES_DB=gestao_img
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres
    networks:
      - app-network

  visualization1:
    build: ./app3-visualizacao
    ports:
      - "8083:5003"
    environment:
      - DELAY=0
      - POSTGRES_DB=gestao_img
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres
    networks:
      - app-network

  visualization2:
    build: ./app3-visualizacao
    ports:
      - "8084:5003"
    environment:
      - DELAY=10
      - POSTGRES_DB=gestao_img
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
