      - DELAY=20
      - POSTGRES_DB=gestao_img
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres
    networks:
      - app-network

  visualization4:
