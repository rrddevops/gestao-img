<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        .fullscreen-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .fullscreen-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="fullscreen-image">
        <img id="currentImage" src="" alt="Imagem em exibição">
    </div>

    <script>
        const currentImage = document.getElementById('currentImage');
        
        async function checkCurrentImage() {
            try {
                const response = await fetch('/current-image');
                if (response.ok) {
                    const data = await response.json();
                    if (data.image_url) {
                        currentImage.src = data.image_url;
                    }
                }
            } catch (error) {
                console.error('Erro ao buscar imagem:', error);
            }
            
            // Verifica a cada segundo
            setTimeout(checkCurrentImage, 1000);
        }

        checkCurrentImage();
    </script>
</body>
</html>
